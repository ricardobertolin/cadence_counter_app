<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14120F">
<meta name="robots" content="noindex">
<title>Cadence</title>
<link rel="canonical" href="./">
<!--
  Compatibility shim. The app used to live at this path; it now lives at ./
  PWAs installed before v1.3.0 have this URL baked into their start_url, so
  without this file they would launch straight into a 404.
  Safe to delete once every device has opened the app at least once.
-->
<noscript><meta http-equiv="refresh" content="0; url=./"></noscript>
<style>
  html, body { margin: 0; height: 100%; background: #14120F; color: #97907F;
    font-family: 'IBM Plex Sans', system-ui, sans-serif; }
  main { height: 100%; display: flex; align-items: center; justify-content: center; }
  a { color: #C9E24B; }
</style>
<script>location.replace('./' + location.search + location.hash);</script>
</head>
<body>
<main><p>Cadence has moved — <a href="./">continue</a>.</p></main>
</body>
</html>
